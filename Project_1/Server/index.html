<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #0f4c75;
            --highlight: #3282b8;
            --text: #eaeaea;
            --danger: #e94560;
            --success: #2ecc71;
            --warning: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--highlight), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-item {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .control-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--highlight);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--highlight);
            border-radius: 2px;
        }

        /* Joystick Styles */
        .joystick-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .joystick-base {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joystick-stick {
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--highlight), var(--accent));
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 5px 20px rgba(50, 130, 184, 0.5);
            transition: transform 0.1s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .joystick-stick:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .joystick-center {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Slider Styles */
        .slider-group {
            margin-bottom: 25px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95em;
            color: var(--text);
        }

        .slider-value {
            color: var(--highlight);
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--highlight), var(--accent));
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(50, 130, 184, 0.5);
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--highlight), var(--accent));
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 10px rgba(50, 130, 184, 0.5);
        }

        /* Button Styles */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .control-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent), var(--highlight));
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(50, 130, 184, 0.3);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(50, 130, 184, 0.5);
        }

        .control-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(50, 130, 184, 0.3);
        }

        .stop-btn {
            background: linear-gradient(135deg, #e74c3c, var(--danger));
            grid-column: span 2;
            font-size: 1.1em;
            padding: 18px;
        }

        .stop-btn:hover {
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.5);
        }

        /* Feedback Messages */
        .feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            border-left: 4px solid var(--success);
        }

        .feedback.show {
            transform: translateX(0);
        }

        .feedback.error {
            border-left-color: var(--danger);
        }

        .feedback.warning {
            border-left-color: var(--warning);
        }

        /* Connection Status */
        .connection-lost {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 2000;
            display: none;
            border: 2px solid var(--danger);
        }

        .connection-lost.show {
            display: block;
        }

        .connection-lost h2 {
            color: var(--danger);
            margin-bottom: 15px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .control-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .joystick-container {
                width: 200px;
                height: 200px;
            }

            .joystick-stick {
                width: 60px;
                height: 60px;
            }
        }

        /* Loading Animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--highlight);
            animation: spin 1s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Robot Control Interface</h1>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-indicator"></div>
                    <span>Connected</span>
                </div>
                <div class="status-item">
                    <span>Status: <span id="robot-status">Ready</span></span>
                </div>
            </div>
        </header>

        <div class="control-grid">
            <!-- Drive Control -->
            <div class="control-panel">
                <div class="panel-header">Drive Control</div>
                <div class="joystick-container" id="joystick-container">
                    <div class="joystick-base">
                        <div class="joystick-center"></div>
                        <div class="joystick-stick" id="joystick-stick"></div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 15px; font-size: 0.9em; color: rgba(255,255,255,0.7);">
                    <div>Left: <span id="left-wheel">0</span>%</div>
                    <div>Right: <span id="right-wheel">0</span>%</div>
                </div>
            </div>

            <!-- Head Control -->
            <div class="control-panel">
                <div class="panel-header">Head Control</div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Tilt (Up/Down)</span>
                        <span class="slider-value"><span id="tilt-value">90</span>°</span>
                    </div>
                    <input type="range" id="head-tilt" min="0" max="180" value="90" step="1">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Pan (Left/Right)</span>
                        <span class="slider-value"><span id="pan-value">90</span>°</span>
                    </div>
                    <input type="range" id="head-pan" min="0" max="180" value="90" step="1">
                </div>
            </div>

            <!-- Waist Control -->
            <div class="control-panel">
                <div class="panel-header">Waist Rotation</div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Rotation</span>
                        <span class="slider-value"><span id="waist-value">90</span>°</span>
                    </div>
                    <input type="range" id="waist-rotation" min="0" max="180" value="90" step="1">
                </div>
            </div>

            <!-- Voice Output -->
            <div class="control-panel">
                <div class="panel-header">Voice Output</div>
                
                <div class="button-grid">
                    <button class="control-btn" onclick="speak('phrase1')">
                        Greeting
                    </button>
                    <button class="control-btn" onclick="speak('phrase2')">
                        Compliment
                    </button>
                    <button class="control-btn" onclick="speak('phrase3')">
                        Warning
                    </button>
                    <button class="control-btn" onclick="speak('phrase4')">
                        Statement
                    </button>
                    <button class="control-btn stop-btn" onclick="emergencyStop()">
                        ⚠️ EMERGENCY STOP
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Feedback Toast -->
    <div id="feedback" class="feedback"></div>

    <!-- Connection Lost Overlay -->
    <div id="connection-lost" class="connection-lost">
        <h2>⚠️ Connection Lost</h2>
        <p>Attempting to reconnect...</p>
        <div class="loading" style="margin: 20px auto;"></div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const API_BASE = window.location.origin;
        const JOYSTICK_DEAD_ZONE = 10; // pixels
        const COMMAND_THROTTLE = 100; // milliseconds
        
        // ==================== STATE ====================
        let joystickActive = false;
        let lastCommandTime = 0;
        let connectionHealthy = true;
        let heartbeatInterval;

        // ==================== JOYSTICK CONTROL ====================
        const joystickContainer = document.getElementById('joystick-container');
        const joystickStick = document.getElementById('joystick-stick');
        const leftWheelDisplay = document.getElementById('left-wheel');
        const rightWheelDisplay = document.getElementById('right-wheel');

        let joystickCenter = { x: 0, y: 0 };
        let maxRadius = 0;

        function initJoystick() {
            const rect = joystickContainer.getBoundingClientRect();
            joystickCenter = {
                x: rect.width / 2,
                y: rect.height / 2
            };
            maxRadius = rect.width / 2 - 40; // Account for stick size
        }

        function updateJoystickPosition(x, y) {
            const dx = x - joystickCenter.x;
            const dy = y - joystickCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Apply dead zone
            if (distance < JOYSTICK_DEAD_ZONE) {
                joystickStick.style.left = '50%';
                joystickStick.style.top = '50%';
                sendDriveCommand(0, 0);
                return;
            }

            // Constrain to circle
            const constrainedDistance = Math.min(distance, maxRadius);
            const angle = Math.atan2(dy, dx);
            const constrainedX = joystickCenter.x + constrainedDistance * Math.cos(angle);
            const constrainedY = joystickCenter.y + constrainedDistance * Math.sin(angle);

            joystickStick.style.left = constrainedX + 'px';
            joystickStick.style.top = constrainedY + 'px';

            // Calculate wheel speeds
            const normalizedX = (constrainedX - joystickCenter.x) / maxRadius;
            const normalizedY = -(constrainedY - joystickCenter.y) / maxRadius; // Invert Y

            // Differential drive calculation
            let left = normalizedY + normalizedX;
            let right = normalizedY - normalizedX;

            // Normalize to -100 to 100
            const maxVal = Math.max(Math.abs(left), Math.abs(right), 1);
            left = (left / maxVal) * 100;
            right = (right / maxVal) * 100;

            sendDriveCommand(left, right);
        }

        function resetJoystick() {
            joystickStick.style.left = '50%';
            joystickStick.style.top = '50%';
            sendDriveCommand(0, 0);
        }

        // Mouse events
        joystickStick.addEventListener('mousedown', (e) => {
            joystickActive = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (joystickActive) {
                const rect = joystickContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                updateJoystickPosition(x, y);
            }
        });

        document.addEventListener('mouseup', () => {
            if (joystickActive) {
                joystickActive = false;
                resetJoystick();
            }
        });

        // Touch events
        joystickStick.addEventListener('touchstart', (e) => {
            joystickActive = true;
            e.preventDefault();
        });

        document.addEventListener('touchmove', (e) => {
            if (joystickActive) {
                const touch = e.touches[0];
                const rect = joystickContainer.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                updateJoystickPosition(x, y);
                e.preventDefault();
            }
        });

        document.addEventListener('touchend', () => {
            if (joystickActive) {
                joystickActive = false;
                resetJoystick();
            }
        });

        // ==================== API CALLS ====================
        function throttleCommand(callback) {
            const now = Date.now();
            if (now - lastCommandTime > COMMAND_THROTTLE) {
                lastCommandTime = now;
                callback();
            }
        }

        async function sendDriveCommand(left, right) {
            throttleCommand(async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/drive`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ left, right })
                    });

                    if (!response.ok) throw new Error('Drive command failed');

                    const data = await response.json();
                    leftWheelDisplay.textContent = Math.round(data.left);
                    rightWheelDisplay.textContent = Math.round(data.right);
                    
                    markConnectionHealthy();
                } catch (error) {
                    console.error('Drive error:', error);
                    handleConnectionError();
                }
            });
        }

        async function sendHeadCommand(tilt, pan) {
            try {
                const body = {};
                if (tilt !== undefined) body.tilt = tilt;
                if (pan !== undefined) body.pan = pan;

                const response = await fetch(`${API_BASE}/api/head`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!response.ok) throw new Error('Head command failed');
                markConnectionHealthy();
            } catch (error) {
                console.error('Head error:', error);
                handleConnectionError();
            }
        }

        async function sendWaistCommand(rotation) {
            try {
                const response = await fetch(`${API_BASE}/api/waist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rotation })
                });

                if (!response.ok) throw new Error('Waist command failed');
                markConnectionHealthy();
            } catch (error) {
                console.error('Waist error:', error);
                handleConnectionError();
            }
        }

        async function speak(phraseId) {
            try {
                const response = await fetch(`${API_BASE}/api/speak`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phrase: phraseId })
                });

                if (!response.ok) throw new Error('Speak command failed');
                
                const data = await response.json();
                showFeedback(`Speaking: "${data.text}"`, 'success');
                markConnectionHealthy();
            } catch (error) {
                console.error('Speak error:', error);
                showFeedback('Failed to speak', 'error');
                handleConnectionError();
            }
        }

        async function emergencyStop() {
            try {
                const response = await fetch(`${API_BASE}/api/stop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error('Stop command failed');
                
                showFeedback('Emergency stop activated!', 'warning');
                resetJoystick();
                markConnectionHealthy();
            } catch (error) {
                console.error('Stop error:', error);
                showFeedback('Failed to stop robot', 'error');
            }
        }

        // ==================== SLIDER EVENTS ====================
        const headTilt = document.getElementById('head-tilt');
        const headPan = document.getElementById('head-pan');
        const waistRotation = document.getElementById('waist-rotation');

        headTilt.addEventListener('input', (e) => {
            document.getElementById('tilt-value').textContent = e.target.value;
            throttleCommand(() => sendHeadCommand(parseInt(e.target.value), undefined));
        });

        headPan.addEventListener('input', (e) => {
            document.getElementById('pan-value').textContent = e.target.value;
            throttleCommand(() => sendHeadCommand(undefined, parseInt(e.target.value)));
        });

        waistRotation.addEventListener('input', (e) => {
            document.getElementById('waist-value').textContent = e.target.value;
            throttleCommand(() => sendWaistCommand(parseInt(e.target.value)));
        });

        // ==================== FEEDBACK & CONNECTION ====================
        function showFeedback(message, type = 'success') {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.className = `feedback show ${type}`;
            
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 3000);
        }

        function markConnectionHealthy() {
            connectionHealthy = true;
            document.getElementById('connection-lost').classList.remove('show');
        }

        function handleConnectionError() {
            connectionHealthy = false;
            document.getElementById('connection-lost').classList.add('show');
            resetJoystick();
        }

        // ==================== PAGE LIFECYCLE ====================
        window.addEventListener('beforeunload', (e) => {
            // Stop robot when page is about to close
            emergencyStop();
        });

        window.addEventListener('load', () => {
            initJoystick();
            showFeedback('Robot interface ready', 'success');
            
            // Start heartbeat to detect connection issues
            heartbeatInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/status`);
                    if (!response.ok) throw new Error('Heartbeat failed');
                    markConnectionHealthy();
                } catch (error) {
                    handleConnectionError();
                }
            }, 3000);
        });

        window.addEventListener('resize', () => {
            initJoystick();
            resetJoystick();
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                emergencyStop();
            }
        });
    </script>
</body>
</html>
